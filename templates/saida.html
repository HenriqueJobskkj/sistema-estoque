{% extends "base.html" %}

{% block titulo %}Saída de estoque{% endblock %}

{% block conteudo %}
<h2 class="titulo-pagina">Saída de estoque</h2>

<div class="cartao">
    {% if produtos %}
    <form method="POST" action="{{ url_for('movimentacoes.saida') }}">

        <div class="campo">
            <label for="produto_id">Produto *</label>
            <select id="produto_id" name="produto_id" required>
                <option value="">Selecione um produto...</option>
                {% for p in produtos %}
                <option value="{{ p.id }}" data-estoque="{{ p.quantidade }}"
                        {% if form.produto_id == p.id|string %}selected{% endif %}>
                    {{ p.codigo }} - {{ p.nome }} (estoque atual: {{ p.quantidade }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="quantidade">Quantidade de saída *</label>
            <input type="number" id="quantidade" name="quantidade" min="1" step="1"
                   value="{{ form.quantidade or '' }}" required>
        </div>

        <div class="campo">
            <label for="observacao">Observação (opcional)</label>
            <input type="text" id="observacao" name="observacao" maxlength="255"
                   placeholder="Ex.: Venda"
                   value="{{ form.observacao or '' }}">
        </div>

        <!-- Prévia preenchida pelo JavaScript (data-tipo diz que é uma saída) -->
        <p id="previa" class="previa" data-tipo="saida"></p>

        <div class="botoes-form">
            <button type="submit" class="botao botao-vermelho">Confirmar saída</button>
            <a href="{{ url_for('produtos.listar') }}" class="botao botao-cinza">Cancelar</a>
        </div>
    </form>
    {% else %}
        <p class="texto-vazio">
            Nenhum produto cadastrado.
            <a href="{{ url_for('produtos.novo') }}">Cadastre um produto</a>
            antes de registrar saídas.
        </p>
    {% endif %}
</div>
{% endblock %}
